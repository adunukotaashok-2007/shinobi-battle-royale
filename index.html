<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shinobi Battle Royale</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MENU -->

    <div id="menu">

        <h1>🥷 SHINOBI BATTLE ROYALE</h1>

        <p>Enter the Ninja Village</p>

        <button onclick="startGame()">
            START GAME
        </button>

    </div>


    <!-- GAME -->

    <div id="game">

        <!-- HUD -->

        <div id="hud">

            <div>
                ❤️ PLAYER:
                <span id="health">100</span>
            </div>

            <div>
                🌀 CHAKRA:
                <span id="chakra">100</span>
            </div>

            <div>
                👹 ENEMIES:
                <span id="enemy-count">3</span>
            </div>

        </div>


        <!-- VILLAGE -->

        <div id="village">

            <!-- VILLAGE HALL -->

            <div class="building village-hall">
                🏯
                <span>Village Hall</span>
            </div>


            <!-- HOUSES -->

            <div class="building house house1">
                🏠
            </div>

            <div class="building house house2">
                🏠
            </div>

            <div class="building house house3">
                🏠
            </div>

            <div class="building house house4">
                🏠
            </div>


            <!-- TRAINING GROUND -->

            <div id="training-ground">

                🎯

                <span>
                    Training Ground
                </span>

            </div>


            <!-- RIVER -->

            <div id="river"></div>


            <!-- TREES -->

            <div class="tree tree1">🌳</div>
            <div class="tree tree2">🌳</div>
            <div class="tree tree3">🌳</div>
            <div class="tree tree4">🌳</div>
            <div class="tree tree5">🌳</div>
            <div class="tree tree6">🌳</div>


            <!-- PLAYER -->

            <div id="player">

                <div id="player-character">
                    🥷
                </div>

            </div>


            <!-- ENEMIES ARE CREATED BY JAVASCRIPT -->

            <div id="enemies"></div>

        </div>


        <!-- MESSAGE -->

        <div id="message">

            WASD / Arrow Keys — Move
            <br>

            SPACE — Attack

        </div>


        <!-- GAME OVER -->

        <div id="game-over">

            <h1 id="game-over-title">
                💀 DEFEATED
            </h1>

            <p id="game-over-text">
                Your ninja has fallen.
            </p>

            <button onclick="restartGame()">
                RESTART
            </button>

        </div>

    </div>


    <script src="game.js"></script>

</body>

</html>
