<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi Battle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="menu">
    <h1>🥷 SHINOBI BATTLE</h1>
    <p>Enter the Ninja Village</p>

    <button id="startButton">
        START GAME
    </button>
</div>


<div id="game">

    <div id="hud">
        ❤️ Health: <span id="health">100</span>
        &nbsp;&nbsp;
        👹 Enemies: <span id="enemyCount">3</span>
    </div>


    <div id="village">

        <div class="building hall">
            🏯
        </div>

        <div class="building house1">
            🏠
        </div>

        <div class="building house2">
            🏠
        </div>

        <div class="tree tree1">
            🌳
        </div>

        <div class="tree tree2">
            🌳
        </div>


        <!-- PLAYER -->

        <div id="player">
            🥷
        </div>


        <!-- ENEMIES -->

        <div id="enemy1" class="enemy">
            <div class="enemyBar">
                <div id="enemyHealth1"
                     class="enemyHealth">
                </div>
            </div>

            👹

            <small>ENEMY 1</small>
        </div>


        <div id="enemy2" class="enemy">
            <div class="enemyBar">
                <div id="enemyHealth2"
                     class="enemyHealth">
                </div>
            </div>

            👺

            <small>ENEMY 2</small>
        </div>


        <div id="enemy3" class="enemy">
            <div class="enemyBar">
                <div id="enemyHealth3"
                     class="enemyHealth">
                </div>
            </div>

            👿

            <small>ENEMY 3</small>
        </div>

    </div>


    <div id="message">
        WASD / Arrow Keys = Move<br>
        SPACE = Attack
    </div>

</div>


<script src="game.js"></script>

</body>
</html>
