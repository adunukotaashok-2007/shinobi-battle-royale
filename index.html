<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shinobi Battle Royale</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="menu">
        <h1>🥷 SHINOBI BATTLE ROYALE</h1>

        <p>Enter the Ninja Village</p>

        <button onclick="startGame()">START GAME</button>
    </div>

    <div id="game">
        <div id="hud">
            ❤️ Health: <span id="health">100</span>
            &nbsp;&nbsp;
            🌀 Chakra: <span id="chakra">100</span>
        </div>

        <div id="player">🥷</div>

        <div id="message">
            Use WASD or Arrow Keys to move
        </div>
    </div>

    <script src="game.js"></script>

</body>
</html>
